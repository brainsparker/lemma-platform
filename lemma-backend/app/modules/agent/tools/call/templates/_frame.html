<style>
  .cv { display: flex; flex-direction: column; gap: 10px; }
  .cv__title { margin: 0; font-size: 19px; line-height: 1.25; color: var(--w-ink, #1a1a1a); }
  .cv__caption { margin: 0; font-size: 13.5px; color: var(--w-ink-2, #555); }
  .cv__body { min-height: 40px; }
  .cv__failed { font: 13px/1.45 var(--w-mono, ui-monospace, monospace); color: var(--w-warn, #b45309); white-space: pre-wrap; }
</style>
<section class="w" data-lemma-widget-version="1">
  <div class="w-card cv">
    <h2 class="cv__title" id="cv-title"></h2>
    <p class="cv__caption" id="cv-caption" hidden></p>
    <div class="cv__body" id="cv-body"></div>
  </div>
</section>
<script>
  (function () {
    var d = lemma.data || {};
    document.getElementById("cv-title").textContent = d.title || "";
    if (d.caption) {
      var c = document.getElementById("cv-caption");
      c.textContent = d.caption; c.hidden = false;
    }
    /* A canvas item that cannot draw says so in place, and tells the call
       screen, which tells the agent that drew it so it can fix it. */
    window.canvasFailed = function (message) {
      var body = document.getElementById("cv-body");
      body.innerHTML = '<p class="cv__failed"></p>';
      body.firstChild.textContent = "Could not draw this: " + message;
      try { window.parent.postMessage({ type: "lemma-canvas-error", message: String(message).slice(0, 500) }, "*"); } catch (e) {}
    };
  })();
</script>
