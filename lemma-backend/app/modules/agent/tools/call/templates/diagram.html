<style>
  #cv-body svg { max-width: 100%; height: auto; }
</style>
<script type="module">
  const d = lemma.data || {};
  const ink = getComputedStyle(document.documentElement).getPropertyValue("--w-ink").trim();
  const dark = /^#?[0-9a-f]{6}$/i.test(ink.replace("#", "")) && parseInt(ink.replace("#", "").slice(0, 2), 16) > 160;
  try {
    /* Loaded here rather than imported at the top: a library that cannot load
       must reach the failure path like any other error, not leave a blank. */
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral", securityLevel: "strict", fontFamily: "inherit" });
    await mermaid.parse(d.mermaid || "");
    const { svg } = await mermaid.render("cv-diagram", d.mermaid || "");
    document.getElementById("cv-body").innerHTML = svg;
  } catch (error) {
    window.canvasFailed((error && (error.message || error.str)) || "invalid diagram");
  }
</script>
