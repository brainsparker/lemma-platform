<style>
  #cv-body img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; border-radius: var(--w-r-md, 8px); }
</style>
<script>
  (function () {
    var d = lemma.data || {}, img = document.createElement("img");
    img.alt = d.caption || d.title || "";
    img.onerror = function () { window.canvasFailed("the image did not load from " + d.url); };
    img.src = d.url || "";
    document.getElementById("cv-body").appendChild(img);
  })();
</script>
