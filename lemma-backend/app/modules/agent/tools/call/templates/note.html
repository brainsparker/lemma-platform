<style>
  #cv-body { font-size: 15px; line-height: 1.55; color: var(--w-ink, #1a1a1a); }
  #cv-body h1, #cv-body h2, #cv-body h3 { font-size: 16px; margin: 14px 0 6px; }
  #cv-body ul, #cv-body ol { padding-left: 20px; margin: 6px 0; }
  #cv-body table { border-collapse: collapse; font-size: 13.5px; }
  #cv-body th, #cv-body td { border-bottom: 1px solid var(--w-line-2, #e5e5e5); padding: 5px 10px 5px 0; text-align: left; }
  #cv-body code { font-family: var(--w-mono, ui-monospace, monospace); font-size: 13px; }
</style>
<script type="module">
  import { marked } from "https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.esm.js";
  import DOMPurify from "https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs";
  const d = lemma.data || {};
  try {
    document.getElementById("cv-body").innerHTML = DOMPurify.sanitize(marked.parse(d.markdown || ""));
  } catch (error) { window.canvasFailed((error && error.message) || "invalid note"); }
</script>
